<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Replacer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1><span class="icon">⤾</span> Path Replacer</h1>
        <button id="refreshBtn" class="icon-btn" title="Refresh Selection">↻ Refresh</button>
    </div>

    <!-- Selection Section -->
    <div class="card" id="selectionCard">
        <div class="card-title">Selection</div>
        <div id="selectionContent">
            <div class="empty-state">
                <div>No shapes selected</div>
                <div class="hint">Select 2+ shapes on canvas</div>
            </div>
        </div>
    </div>

    <!-- Placement Mode Section -->
    <div class="card">
        <div class="card-title">Placement Mode</div>
        <select id="alignMode" class="mode-select">
            <option value="absolute" selected>Source Position</option>
            <option value="center">Center on Target</option>
            <option value="fit">Fit to Target</option>
            <option value="stretch">Stretch to Target</option>
        </select>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button id="replaceBtn" class="primary-btn" disabled>Replace Path</button>
        <div id="statusToast" class="status-toast">Ready (Single Ctrl+Z Undo)</div>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
