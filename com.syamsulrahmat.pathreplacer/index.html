<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Replacer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1><span class="icon">⤾</span> Path Replacer</h1>
        <button id="refreshBtn" class="icon-btn" title="Refresh Selection">↻ Refresh</button>
    </div>

    <!-- Selection Section -->
    <div class="card" id="selectionCard">
        <div class="card-title">Selection</div>
        <div id="selectionContent">
            <div class="empty-state">
                <div>No shapes selected</div>
                <div class="hint">Select 2+ shapes on canvas</div>
            </div>
        </div>
    </div>

    <!-- Placement Mode Section -->
    <div class="card">
        <div class="card-title">Placement Mode</div>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="alignMode" value="absolute" checked>
                <span class="radio-title">Source Position</span>
                <span class="radio-tag">Default</span>
            </label>
            <label class="radio-label">
                <input type="radio" name="alignMode" value="center">
                <span class="radio-title">Center on Target</span>
            </label>
            <label class="radio-label">
                <input type="radio" name="alignMode" value="fit">
                <span class="radio-title">Fit to Target</span>
            </label>
            <label class="radio-label">
                <input type="radio" name="alignMode" value="stretch">
                <span class="radio-title">Stretch to Target</span>
            </label>
        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button id="replaceBtn" class="primary-btn" disabled>Replace Path</button>
        <div id="statusToast" class="status-toast">Ready (Single Ctrl+Z Undo)</div>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
