<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path Replacer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1><span class="icon">⤾</span> Path Replacer</h1>
        <button id="refreshBtn" class="icon-btn" title="Refresh Selection on Canvas">↻ Refresh</button>
    </div>

    <!-- Selection Section -->
    <div class="card" id="selectionCard">
        <div class="card-title">Selection</div>
        <div id="selectionContent">
            <div class="empty-state">
                <div>No shapes selected</div>
                <div class="hint">Select at least 2 vector shapes on canvas</div>
            </div>
        </div>
    </div>

    <!-- Alignment Mode Section -->
    <div class="card">
        <div class="card-title">Placement Mode</div>
        <div class="radio-group">
            <label class="radio-label">
                <input type="radio" name="alignMode" value="center" checked>
                <div>
                    <div>In-Place (Center on Target)</div>
                    <span class="radio-desc">Keep original size & center on destination</span>
                </div>
            </label>
            <label class="radio-label">
                <input type="radio" name="alignMode" value="fit">
                <div>
                    <div>Fit to Target Bounds</div>
                    <span class="radio-desc">Scale proportionally inside target box</span>
                </div>
            </label>
            <label class="radio-label">
                <input type="radio" name="alignMode" value="stretch">
                <div>
                    <div>Stretch to Target Bounds</div>
                    <span class="radio-desc">Scale width & height to match target</span>
                </div>
            </label>
            <label class="radio-label">
                <input type="radio" name="alignMode" value="absolute">
                <div>
                    <div>Source Position (AE Style)</div>
                    <span class="radio-desc">Keep source's exact document coordinates</span>
                </div>
            </label>
        </div>
    </div>

    <!-- Actions -->
    <div class="actions">
        <button id="replaceBtn" class="primary-btn" disabled>Replace Path</button>
        <div id="statusToast" class="status-toast">Ready (Single Ctrl+Z Undo)</div>
    </div>

    <script src="js/CSInterface.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
